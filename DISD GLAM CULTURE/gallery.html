<main>
<section class="heading">
<h1>Our Gallery</h1>
<p>A look at our beauty and glam inspiration.</p>
</section>
<section aria-label="Featured beauty slideshow" class="slideshow reveal">
<h2>Featured Glam Inspiration</h2>

</div>
<div class="slide-controls">
<button class="btn btn-dark" id="previousSlide" type="button">Previous</button>
<span aria-live="polite" id="slideCounter">1 of 6</span>
<button class="btn btn-dark" id="nextSlide" type="button">Next</button>
<button aria-pressed="false" class="btn" id="toggleSlideshow" type="button">Pause slideshow</button>
</div>
</section>
<section aria-label="Beauty gallery" class="gallery reveal">
<button class="gallery-item lightbox-trigger" data-lightbox="" type="button"><img alt="Hair styling inspiration" loading="lazy" src="images/hair.jpg"/><span>Hair Styling</span></button>
<button class="gallery-item lightbox-trigger" data-lightbox="" type="button"><img alt="Nail design inspiration" loading="lazy" src="images/nails.jpg"/><span>Nail Designs</span></button>

<button class="gallery-item lightbox-trigger" data-lightbox="" type="button"><img alt="Bridal beauty inspiration" loading="lazy" src="images/bridal.jpg"/><span>Bridal Beauty</span></button>
<button class="gallery-item lightbox-trigger" data-lightbox="" type="button"><img alt="Glam Culture beauty inspiration" loading="lazy" src="images/beauty.jpg"/><span>Glam Culture</span></button>
</section>

<img alt="" id="lightboxImage" src=""/>
<p id="lightboxCaption"></p>
</dialog>
